openapi: 3.0.3
info:
  title: recommend4me
  version: 0.1.0
  description: |
    A local recommender of works — games, books — collected from sites by plugins. The user grades
    some of them; a model learns the order of the grades and puts every other work on the user's
    own 0..10 scale.

    An error is answered as application/problem+json (the Problem schema). The server words nothing
    for the user: what went wrong is the key of its words ("code", "standard:error.noField") and the
    values they are filled with ("params"); "detail" says it in English, for the log.

tags:
  - name: types
  - name: items
  - name: corrections
  - name: jobs
  - name: model
  - name: settings
  - name: capture
  - name: status
  - name: pages
  - name: suggestions
  - name: universes
  - name: tags

paths:
  /api/types:
    get:
      tags: [types]
      operationId: listTypes
      summary: The content types with their sources and what the sources know of their items
      responses:
        '200':
          description: Content types that have at least one source
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentTypeInfo'

  /api/types/{type}/items:
    post:
      tags: [items]
      operationId: listItems
      summary: A page of the works of a content type, one card per work
      description: |
        Asked with a body, not with the address: the values of a filter hidden are hundreds at
        times (every fandom but two), and an address of them all is beyond what the server reads.
      parameters:
        - $ref: '#/components/parameters/Type'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemQuery'
      responses:
        '200':
          description: The page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'

  /api/types/{type}/search/judgments:
    put:
      tags: [items]
      operationId: judgeSearch
      summary: The user's word on whether a work found answers the line searched
      description: |
        What the quality of the search is measured by (getSearchQuality); never learnt from by the
        model of the grades. The line is one query however typed: trimmed, in lower case.
      parameters:
        - $ref: '#/components/parameters/Type'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchJudgment'
      responses:
        '204':
          description: Kept, or taken back

  /api/types/{type}/search/quality:
    get:
      tags: [items]
      operationId: getSearchQuality
      summary: How well the search finds what the user judged, with the reranker and without
      description: |
        Every line the user judged works for is searched again, both ways; of each, where the first
        work judged fitting stands, and how many works judged fitting and not fitting are among the
        first [top] — the works not judged among them are counted apart, neither.
      parameters:
        - $ref: '#/components/parameters/Type'
        - name: top
          in: query
          required: true
          description: How many of the first works found are counted
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The measure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchQuality'

  /api/types/{type}/facets:
    get:
      tags: [items]
      operationId: listFacets
      summary: The filter facets of a content type with their values and how many works have each
      parameters:
        - $ref: '#/components/parameters/Type'
      responses:
        '200':
          description: The facets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacetFilter'

  /api/types/{type}/lookup:
    get:
      tags: [items]
      operationId: lookupItems
      summary: Works of a content type by a piece of the title or by the address of the work's page, each item apart
      description: |
        Unlike the list, every item is found by itself, linked to others or not: what the user
        looks for when saying two items are one work.
      parameters:
        - $ref: '#/components/parameters/Type'
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: The items found, the address first, then by the title
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkedItem'

  /api/sources/{source}/facets/{facet}/values:
    get:
      tags: [items]
      operationId: listFacetValues
      summary: The values of a facet of a source, by how many items have each, for a value to be added
      parameters:
        - $ref: '#/components/parameters/Source'
        - name: facet
          in: path
          required: true
          schema:
            type: string
        - name: query
          in: query
          description: A piece of the name, any case; all when none
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: The values, the most used first; the ones the user made up among them
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacetValueUse'
        '404':
          description: No such source or facet

  /api/items/{source}/{item}:
    get:
      tags: [items]
      operationId: getItem
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
      responses:
        '200':
          description: Everything known of the item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetails'
        '404':
          description: No such item
    delete:
      tags: [items]
      operationId: removeItem
      summary: Removes the work from the library, with everything of it
      description: |
        For a work gone from the site: the work, its texts, pictures (their files too), reviews,
        parts and every vector of them, the user's answers, links, grades and marks, and what the
        model made of it. Not undone: seen on the site again, the work is made anew, as one never
        seen - without the user's grades and answers.
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
      responses:
        '204':
          description: Removed
        '404':
          description: No such item

  /api/items/{source}/{item}/explanation:
    get:
      tags: [items]
      operationId: getExplanation
      summary: What moves the work's prediction, part by part, strongest first - the parts alone, without their features
      description: |
        Of a graded work, the explanation of the model that had not seen it (HeldOut): that model is
        fitted for the asking and takes a second or more, so a page reads it apart from the work.
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
      responses:
        '200':
          description: The parts; none without a model
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContributionGroup'
        '404':
          description: No such item

  /api/items/{source}/{item}/held-out:
    get:
      tags: [items]
      operationId: getHeldOut
      summary: How a model that had not seen the graded work would grade it, and why
      description: |
        The model of the fold the work was left out of is fitted for the asking on the catalogue as
        it is now: it takes a second or more, so it is read apart from the work's details.
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
      responses:
        '200':
          description: The work's score by that model and what moves it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeldOut'
        '204':
          description: The work is not graded, there is no model, or too few works for folds
        '404':
          description: No such item

  /api/items/{source}/{item}/suggestions:
    get:
      tags: [suggestions]
      operationId: getSuggestions
      summary: The values the work more likely has than not and lacks, worked out from its texts and its other values
      description: |
        For every facet its source suggests values of. The user confirms one by adding it
        (correctFacet, added) and rejects one by taking it away (correctFacet, not added); an
        answered value is no longer listed. Made at once for a work that never had any.
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
      responses:
        '200':
          description: The suggestions, one entry per facet
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacetSuggestions'
        '404':
          description: No such item

  /api/items/{source}/{item}/suggestions/settled:
    get:
      tags: [suggestions]
      operationId: settleSuggestions
      summary: Answers once the work's chances are made current after every answer on it so far
      description: |
        An answer on a facet (correctFacet, uncorrectFacet, completeFacet) is saved and returned at
        once; the chances it changes - of that facet and of those made of its values - are made
        apart, a second or two. Answers that come meanwhile are gathered and made once for them all.
        This answers when that is done, at once when nothing is being made: the page then reads the
        work and its suggestions anew.
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
      responses:
        '204':
          description: The work's chances are current
        '404':
          description: No such item

  /api/items/{source}/{item}/candidates:
    get:
      tags: [suggestions]
      operationId: getCandidates
      summary: Every value the work may be given of a facet, to choose among
      description: |
        Every value of the facet the work does not have and the user has not answered on, with the
        model's chance and how many times the work's own texts name it (a character in the chapters
        read, two characters in one paragraph); the likeliest first, then the most named. Of the
        facets of the universes - "characters" (the characters of the work's universes and the
        original ones), "pairings" (pairs of its characters), "universe" - those the work may have;
        of any other facet the model works out (the tags), every value, its chances made now: the
        values offered beside the work's are the likeliest of these, and the rest are here for the
        user who asks for more.
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
        - name: facet
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candidate'
        '404':
          description: No such item

  /api/items/{source}/{item}/mentions:
    get:
      tags: [suggestions]
      operationId: getMentions
      summary: The passages of the work's texts that name a value, its names marked
      description: |
        The passages the mentions of a candidate were counted in (Candidate.mentions): a character
        by its names, a universe by its own name and its characters', a pairing by its two
        characters named in one paragraph - in the order of the work, each with where it is.
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
        - name: facet
          in: query
          required: true
          schema:
            type: string
        - name: value
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The passages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MentionQuote'
        '404':
          description: No such item, or a facet whose values are not counted in the texts

  /api/items/{source}/{item}/refresh:
    post:
      tags: [items]
      operationId: refreshItem
      summary: Downloads the item's page again now, if its source can
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
      responses:
        '200':
          description: The item after the download
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetails'
        '404':
          description: No such item
        '409':
          description: The source cannot download pages
        '502':
          description: The site did not answer

  /api/items/{source}/{item}/rating:
    put:
      tags: [items]
      operationId: rateItem
      summary: Grades the item's current version
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '200':
          description: The item's card after the grade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemSummary'
    delete:
      tags: [items]
      operationId: unrateItem
      summary: Takes back the grade of the item's current version, or of the version named
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
        - name: version
          in: query
          description: An earlier version whose grade is taken back; the current one when none
          schema:
            type: string
      responses:
        '200':
          description: The item's card without the grade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemSummary'

  /api/items/{source}/{item}/interest:
    put:
      tags: [items]
      operationId: markInterest
      summary: Marks the work interesting to read or not, whatever its version; the items linked to it too
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestRequest'
      responses:
        '200':
          description: The item's card after the mark
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemSummary'
    delete:
      tags: [items]
      operationId: unmarkInterest
      summary: Takes back the mark of interest of the work; of the items linked to it too
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
      responses:
        '200':
          description: The item's card without the mark
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemSummary'

  /api/items/{source}/{item}/pictures/{position}:
    get:
      tags: [items]
      operationId: getPicture
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
        - $ref: '#/components/parameters/Position'
        - name: full
          in: query
          description: The original instead of the preview
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The picture
          content:
            image/*:
              schema:
                type: string
                format: binary
        '302':
          description: Not kept here; the site's address
        '404':
          description: No such picture

  /api/items/{source}/{item}/pictures/{position}/mark:
    put:
      tags: [items]
      operationId: markPicture
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
        - $ref: '#/components/parameters/Position'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mark'
      responses:
        '204':
          description: Marked
        '404':
          description: No such picture
    delete:
      tags: [items]
      operationId: unmarkPicture
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
        - $ref: '#/components/parameters/Position'
      responses:
        '204':
          description: Unmarked

  /api/items/{source}/{item}/reviews/{reviewId}/mark:
    put:
      tags: [items]
      operationId: markReview
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mark'
      responses:
        '204':
          description: Marked
        '404':
          description: No such review
    delete:
      tags: [items]
      operationId: unmarkReview
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '204':
          description: Unmarked

  /api/items/{source}/{item}/parts/{partId}:
    get:
      tags: [items]
      operationId: getPart
      summary: The text of a part of the work, as it was read
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
        - name: partId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The part
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartText'
        '404':
          description: No such part, or its text is not kept

  /api/match-feedback:
    post:
      tags: [items]
      operationId: giveMatchFeedback
      summary: The user's word on a match shown for a mark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchFeedbackRequest'
      responses:
        '204':
          description: Kept

  /api/items/{source}/{item}/corrections/facets:
    put:
      tags: [corrections]
      operationId: correctFacet
      summary: The user's word on a value of a facet - the work has it (added) or has it not
      description: |
        added: true gives the work a value it lacks (ADDED) or confirms one the site or the model
        gave it (CONFIRMED); added: false says the work has it not (REMOVED). Either is applied
        over any chance of the model; taking the correction back (uncorrectFacet) leaves the value
        to the site and the model again. Only written, nothing read back: the page shows the answer
        once it is kept, and reads the work anew once the answers have settled.
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacetCorrection'
      responses:
        '200':
          description: The value answered on, by its key - of one named alone, the key found or made for it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacetAnswer'
    delete:
      tags: [corrections]
      operationId: uncorrectFacet
      summary: Takes back a correction of a facet value
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
        - name: facet
          in: query
          required: true
          schema:
            type: string
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Taken back; nothing read back

  /api/items/{source}/{item}/corrections/complete:
    put:
      tags: [corrections]
      operationId: completeFacet
      summary: Says the work's values of a facet are all named - every other is taken from it, in what is shown and what is learnt
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
        - name: facet
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Kept; nothing read back
    delete:
      tags: [corrections]
      operationId: uncompleteFacet
      summary: Takes back that the work's values of a facet are all named
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
        - name: facet
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Taken back; nothing read back

  /api/items/{source}/{item}/corrections/fields/{field}:
    put:
      tags: [corrections]
      operationId: correctField
      summary: Overrides a field of the item ("title", "text:<key>", "number:<key>")
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
        - $ref: '#/components/parameters/Field'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldCorrection'
      responses:
        '200':
          description: The item after the correction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetails'
    delete:
      tags: [corrections]
      operationId: uncorrectField
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
        - $ref: '#/components/parameters/Field'
      responses:
        '200':
          description: The item with the site's value of the field again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetails'

  /api/items/{source}/{item}/links:
    post:
      tags: [corrections]
      operationId: linkItem
      summary: Says the item and another one (of any source of the type) are one work
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemRef'
      responses:
        '200':
          description: The item after the link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetails'
        '400':
          description: The other item is of another content type, or unknown
    delete:
      tags: [corrections]
      operationId: unlinkItem
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Item'
        - name: otherSource
          in: query
          required: true
          schema:
            type: string
        - name: otherItem
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The item after the link is taken back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetails'

  /api/jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: The job of every source that scrapes
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobStatus'

  /api/sources/{source}/job:
    post:
      tags: [jobs]
      operationId: startJob
      parameters:
        - $ref: '#/components/parameters/Source'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '409':
          description: A job of the source is already running, or the source has no such mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
    delete:
      tags: [jobs]
      operationId: cancelJob
      parameters:
        - $ref: '#/components/parameters/Source'
      responses:
        '200':
          description: The job is being stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'

  /api/types/{type}/universes:
    get:
      tags: [universes]
      operationId: listUniverses
      summary: The dictionary of universes of the type, with how many characters and works each has
      parameters:
        - $ref: '#/components/parameters/Type'
      responses:
        '200':
          description: The universes, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UniverseInfo'
    post:
      tags: [universes]
      operationId: addUniverse
      summary: Adds a universe of a catalogue to the dictionary with its characters - or refreshes it
      description: The catalogue is asked now; it may take seconds.
      parameters:
        - $ref: '#/components/parameters/Type'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UniverseRef'
      responses:
        '200':
          description: The universe as the dictionary has it now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniverseInfo'
        '404':
          description: No such catalogue or entry

  /api/types/{type}/universes/search:
    get:
      tags: [universes]
      operationId: searchUniverses
      summary: What the catalogues find by a name - asked only by the user's button
      parameters:
        - $ref: '#/components/parameters/Type'
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The entries found, the likeliest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoundUniverse'

  /api/types/{type}/universes/{catalogue}/{universe}:
    delete:
      tags: [universes]
      operationId: removeUniverse
      summary: Takes the universe out of the dictionary, and every work's link to it
      parameters:
        - $ref: '#/components/parameters/Type'
        - name: catalogue
          in: path
          required: true
          schema:
            type: string
        - name: universe
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed

  /api/types/{type}/universes/{catalogue}/{universe}/classes:
    get:
      tags: [universes]
      operationId: listUniverseClasses
      summary: The classes the entries of a universe are of, the most entries first
      parameters:
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Catalogue'
        - $ref: '#/components/parameters/Universe'
      responses:
        '200':
          description: The classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UniverseClassInfo'

  /api/types/{type}/universes/{catalogue}/{universe}/classes/{class}:
    put:
      tags: [universes]
      operationId: chooseUniverseClass
      summary: The user's word on a class within the universe - its entries kept as characters, or left out
      parameters:
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Catalogue'
        - $ref: '#/components/parameters/Universe'
        - name: class
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Inclusion'
      responses:
        '204':
          description: Saved
        '404':
          description: No such universe
    delete:
      tags: [universes]
      operationId: resetUniverseClass
      summary: Takes the user's word on the class back - the catalogue decides again
      parameters:
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Catalogue'
        - $ref: '#/components/parameters/Universe'
        - name: class
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Taken back
        '404':
          description: No such universe

  /api/types/{type}/universes/{catalogue}/{entry}/name:
    put:
      tags: [universes]
      operationId: nameUniverseEntry
      summary: |
        The name the user gives a universe or a character of the dictionary over the catalogue's - shown everywhere in
        its place, read in the works' texts as one more name of it; none takes it back
      parameters:
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Catalogue'
        - name: entry
          in: path
          required: true
          description: The id of the universe or of the character in the catalogue
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalName'
      responses:
        '204':
          description: Saved

  /api/types/{type}/universes/{catalogue}/{universe}/characters/{character}:
    put:
      tags: [universes]
      operationId: chooseUniverseEntry
      summary: The user's word on one entry of the universe, over its classes - kept as a character, or left out
      parameters:
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Catalogue'
        - $ref: '#/components/parameters/Universe'
        - name: character
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Inclusion'
      responses:
        '204':
          description: Saved
        '404':
          description: No such universe
    delete:
      tags: [universes]
      operationId: resetUniverseEntry
      summary: Takes the user's word on the entry back - its classes decide again
      parameters:
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Catalogue'
        - $ref: '#/components/parameters/Universe'
        - name: character
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Taken back
        '404':
          description: No such universe

  /api/types/{type}/universes/{catalogue}/{universe}/characters:
    get:
      tags: [universes]
      operationId: listCharacters
      summary: Every entry of a universe of the dictionary as the catalogue gave it, with whether it is kept as a character
      parameters:
        - $ref: '#/components/parameters/Type'
        - name: catalogue
          in: path
          required: true
          schema:
            type: string
        - name: universe
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The characters, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CharacterInfo'

  /api/types/{type}/tags:
    get:
      tags: [tags]
      operationId: listTags
      summary: |
        The normalized tags of a content type's free tags - every site's tag is bound to one - as the user
        merged, named and linked them: the most used first
      parameters:
        - $ref: '#/components/parameters/Type'
        - name: query
          in: query
          description: A piece of a name of the tag on a site, or of the name the user gave it, any case
          schema:
            type: string
        - name: with
          in: query
          description: The sites a tag must be used on and the catalogues it must be bound to an entry of, every one of them (TagPage.sources)
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: without
          in: query
          description: The sites a tag must not be used on and the catalogues it must not be bound to an entry of, none of them
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: A page of the tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagPage'
        '404':
          description: No such type, or a type without free tags

  /api/types/{type}/tags/one:
    get:
      tags: [tags]
      operationId: getTag
      parameters:
        - $ref: '#/components/parameters/Type'
        - name: tag
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagInfo'
        '404':
          description: No such tag

  /api/types/{type}/tags/similar:
    get:
      tags: [tags]
      operationId: listSimilarTags
      summary: |
        A page of the table of the alike of a tag: every other normalized tag and every site's tag bound to it,
        but the rows of the relations hidden, the likest first by the meaning of their names, of one site or
        another - alike the tag's names, or alike the query when one is given. Of rows alike equally, by key.
        Only offered: the user merges
      parameters:
        - $ref: '#/components/parameters/Type'
        - name: tag
          in: query
          required: true
          schema:
            type: string
        - name: query
          in: query
          description: A text the rows are to be alike by meaning, in place of the tag's names
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
        - name: hidden
          in: query
          description: The relations whose rows are left out; NONE is never left out
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TagRelation'
      responses:
        '200':
          description: The likest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarTagPage'
        '404':
          description: No such tag

  /api/types/{type}/tags/name:
    put:
      tags: [tags]
      operationId: nameTag
      summary: The name the user gives the tag; none takes it back, and the tag is named by its sites again
      parameters:
        - $ref: '#/components/parameters/Type'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagNameRequest'
      responses:
        '200':
          description: The tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagInfo'

  /api/types/{type}/tags/entries:
    get:
      tags: [tags]
      operationId: findTagEntries
      summary: The entries of the catalogues of tags (Wikidata) a text may stand for - an id or a page's address, the entry itself
      parameters:
        - $ref: '#/components/parameters/Type'
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The entries found, the likeliest first, each with the tag bound to it already
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoundTagEntry'
        '404':
          description: No such type, or one without free tags

  /api/types/{type}/tags/entry:
    put:
      tags: [tags]
      operationId: bindTagEntry
      summary: Binds the tag to an entry of a catalogue besides the ones it is, or no more to it; the label of the one bound first names the tag unless the user named it
      parameters:
        - $ref: '#/components/parameters/Type'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagEntryRequest'
      responses:
        '200':
          description: The tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagInfo'
        '404':
          description: No such tag, catalogue or entry

  /api/types/{type}/tags/hierarchy-offers:
    get:
      tags: [tags]
      operationId: listHierarchyOffers
      summary: >
        The offers of the tags' graph by the catalogues - a tag under another, two tags of one entry merged, a new tag
        above two or more - the ones that change most of the graded works first
      parameters:
        - $ref: '#/components/parameters/Type'
      responses:
        '200':
          description: The offers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HierarchyOffer'

  /api/types/{type}/tags/above:
    post:
      tags: [tags]
      operationId: createTagAbove
      summary: A new tag bound to an entry of a catalogue - named by its label - or a tag there already, put above the tags given
      parameters:
        - $ref: '#/components/parameters/Type'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagAboveRequest'
      responses:
        '200':
          description: The new tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagInfo'
        '404':
          description: No such tag, catalogue or entry

  /api/types/{type}/tags/entries/refresh:
    post:
      tags: [tags]
      operationId: refreshTagEntries
      summary: Reads the entries the tag is bound to of their catalogues again - names, descriptions, what they are a kind of
      parameters:
        - $ref: '#/components/parameters/Type'
        - name: tag
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagInfo'
        '404':
          description: No such tag or catalogue

  /api/types/{type}/tags/relation:
    put:
      tags: [tags]
      operationId: relateTags
      summary: |
        What the user says the other tag is to the tag - merged into it, under it, above it, different, or nothing -
        in place of what was said of the two before
      parameters:
        - $ref: '#/components/parameters/Type'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRelationRequest'
      responses:
        '200':
          description: The tag as it is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagInfo'
        '400':
          description: A tag put above or under one of its own ancestors or descendants

  /api/types/{type}/tags/binding:
    put:
      tags: [tags]
      operationId: bindSiteTag
      summary: |
        A site's tag bound to a normalized tag - to a new one of its own when none is given: taken out of the
        tag it was. The user's answers stay with the tags they were given on
      parameters:
        - $ref: '#/components/parameters/Type'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagBindingRequest'
      responses:
        '200':
          description: The normalized tag the site's tag is bound to now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagInfo'
        '404':
          description: No such site's tag, or no such normalized tag

  /api/types/{type}/model:
    get:
      tags: [model]
      operationId: getModel
      parameters:
        - $ref: '#/components/parameters/Type'
      responses:
        '200':
          description: The model of the content type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInfo'

  /api/types/{type}/model/train:
    post:
      tags: [model]
      operationId: trainModel
      parameters:
        - $ref: '#/components/parameters/Type'
      responses:
        '200':
          description: The model after training
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInfo'

  /api/types/{type}/model/scorer:
    put:
      tags: [model]
      operationId: chooseScorer
      summary: Makes a scorer the one the content type is ranked by, and trains it
      parameters:
        - $ref: '#/components/parameters/Type'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScorerChoice'
      responses:
        '200':
          description: The model after training
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInfo'
        '400':
          description: No such scorer

  /api/types/{type}/model/worth:
    post:
      tags: [model]
      operationId: measurePartWorth
      summary: Cross-validates the ranking without every part of the input in turn; nothing is kept
      description: |
        What every part of a work's input - the annotation, the cover, a facet with all its values,
        a number - is worth to the ranking: the out-of-fold quality of the type's scorer trained
        without it against trained on everything. Takes a training per part.
      parameters:
        - $ref: '#/components/parameters/Type'
      responses:
        '200':
          description: The quality on everything and without every part, the most needed part first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelWorth'
        '404':
          description: No such type, or too few grades to cross-validate

  /api/types/{type}/model/weighing:
    post:
      tags: [model]
      operationId: measureWeighing
      summary: Measures whether a weight of every large part of the input chosen by cross-validation would rank better; nothing is kept
      description: |
        Nested cross-validation: every fold of the works is ranked by a model whose weights of the parts
        were chosen without it, and by one of every weight 1 the same way. Takes hundreds of trainings
      parameters:
        - $ref: '#/components/parameters/Type'
        - name: cautious
          in: query
          required: false
          description: Of the weights within the error of the best, the nearest to 1 (true); the best measured (false)
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: The quality of both fold by fold, the gain, and the weights chosen on every grade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Weighing'
        '404':
          description: No such type, or too few grades to cross-validate

  /api/types/{type}/model/comparison:
    get:
      tags: [model]
      operationId: getScorerComparison
      summary: The comparison of the scorers under way or last made, every scorer's result as soon as it is measured
      parameters:
        - $ref: '#/components/parameters/Type'
      responses:
        '200':
          description: The comparison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScorerComparison'
        '404':
          description: No such type, or no comparison made since the application started
    post:
      tags: [model]
      operationId: startScorerComparison
      summary: Starts cross-validating every scorer on the current grades in the background; nothing is kept
      description: |
        A comparison under way is answered as it stands, not started again. The scorers are measured
        one after another; each one's result appears as soon as it is measured.
      parameters:
        - $ref: '#/components/parameters/Type'
      responses:
        '200':
          description: The comparison as it stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScorerComparison'
        '404':
          description: No such type

  /api/settings:
    get:
      tags: [settings]
      operationId: getSettings
      responses:
        '200':
          description: The settings of every source
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceSettings'

  /api/sources/{source}/settings:
    put:
      tags: [settings]
      operationId: updateSourceSettings
      parameters:
        - $ref: '#/components/parameters/Source'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Setting keys to values; an empty value takes a setting away
              additionalProperties:
                type: string
      responses:
        '200':
          description: The source's settings after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSettings'

  /api/capture/patterns:
    get:
      tags: [capture]
      operationId: getCapturePatterns
      summary: The addresses whose pages the browser extension sends
      responses:
        '200':
          description: The patterns of every source with browser tracking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CapturePatterns'

  /api/capture/extension:
    get:
      tags: [capture]
      operationId: getExtension
      summary: Where the Firefox extension lies on this machine, for the browser to load it
      responses:
        '200':
          description: The extension
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionInfo'

  /api/capture:
    post:
      tags: [capture]
      operationId: capturePage
      summary: A page the user opened, sent by the browser extension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureRequest'
      responses:
        '200':
          description: What the page gave
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureResult'

  /api/capture/recent:
    get:
      tags: [capture]
      operationId: recentCaptures
      summary: The pages received last, newest first
      responses:
        '200':
          description: The pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CapturedPageInfo'

  /api/pages:
    get:
      tags: [pages]
      operationId: getPage
      summary: What the browser extension shows on a page of a site
      description: |
        How the source marks its pages up, and - on a work's page - the work as the application
        knows it: the prediction, the grade, the facets with the user's corrections, the
        suggestions, the marks of its pictures and reviews.
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageView'
        '404':
          description: No source knows the page

  /api/pages/cards:
    post:
      tags: [pages]
      operationId: getCards
      summary: The prediction and the grade of the works the cards of a list link to
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardsRequest'
      responses:
        '200':
          description: One entry per link the application knows the work of
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardView'

  /api/status:
    get:
      tags: [status]
      operationId: getStatus
      summary: The background work of the application
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

components:
  parameters:
    Type:
      name: type
      in: path
      required: true
      schema:
        type: string
    Source:
      name: source
      in: path
      required: true
      schema:
        type: string
    Item:
      name: item
      in: path
      required: true
      schema:
        type: string
    Catalogue:
      name: catalogue
      in: path
      required: true
      description: The catalogue of universes ("wikidata")
      schema:
        type: string
    Universe:
      name: universe
      in: path
      required: true
      description: The universe's id within the catalogue ("Q8337")
      schema:
        type: string
    Position:
      name: position
      in: path
      required: true
      schema:
        type: integer
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: string
    Field:
      name: field
      in: path
      required: true
      schema:
        type: string

  schemas:
    Problem:
      type: object
      description: |
        An error (RFC 9457). The server words nothing for the user: what went wrong is the key of
        its words (code) and the values they are filled with (params); detail is for the log
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: What went wrong, in English, for the log
        code:
          type: string
          description: The key of the words of what went wrong - "standard:error.noField"
        params:
          type: object
          description: The values the words are filled with, by their names
          additionalProperties:
            type: string
        instance:
          type: string

    Grade:
      type: integer
      minimum: 1
      maximum: 5
      description: |
        The user's grade, an order and not a number: 1 - do not like it, 2 - can be played (read),
        3 - liked it on the whole, 4 - very good, 5 - give me more.

    ContentTypeInfo:
      type: object
      description: |
        A content type. Its title, grades and verb are words of the interface by its id
        ("standard:type.<id>.title", "standard:type.<id>.grade.<1..5>", "standard:type.<id>.verb")
      required: [id, sources, numbers, filterNumbers, universes]
      properties:
        id:
          type: string
        universes:
          type: boolean
          description: Works of the type may be fan fiction - it has a dictionary of universes, and every work the facet "universe"
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceInfo'
        numbers:
          type: array
          description: The numbers the list can be sorted by
          items:
            $ref: '#/components/schemas/NumberInfo'
        filterNumbers:
          type: array
          description: The numbers the list can be limited to a range of (listItems, range)
          items:
            $ref: '#/components/schemas/NumberInfo'

    SourceInfo:
      type: object
      description: |
        A source. Its id is the namespace of its own words ("/i18n/<id>/<language>.json"): its title
        is "<id>:title"
      required: [id, homepage, modes, texts, facets, numbers, versioned, picturesTell, signals]
      properties:
        id:
          type: string
        homepage:
          type: string
        modes:
          type: array
          items:
            $ref: '#/components/schemas/SourceMode'
        facets:
          type: array
          items:
            $ref: '#/components/schemas/FacetInfo'
        numbers:
          type: array
          items:
            $ref: '#/components/schemas/NumberInfo'
        texts:
          type: array
          items:
            $ref: '#/components/schemas/TextInfo'
        reviewsLabelKey:
          type: string
          description: The key of what the source calls the reviews it keeps ("ficbook:reviews"); none - it keeps none
        partsLabelKey:
          type: string
          description: The key of what the source calls the parts of a work's text ("ao3:parts"); none - it keeps no text
        versioned:
          type: boolean
        picturesTell:
          type: boolean
          description: The pictures of a work tell what it is (a game's screenshots) and come before its texts
        signals:
          type: array
          description: The kinds of the user's own actions on the site, with the names to show
          items:
            $ref: '#/components/schemas/SignalInfo'

    FacetRole:
      type: string
      description: |
        What a facet tells of a work, for the card to put it where it decides: AUTHOR - who made it
        (their other works are shown); SERIES - the series it is a part of (its other parts are
        shown); STATUS - finished or not; FORM - a novel, an engine; CONTENT - genres, tags, fandom;
        ORIGINAL - the site's own word on what the application works out (its tags, fandoms,
        pairings and characters), shown first, above the values the user answers on
      enum: [AUTHOR, SERIES, STATUS, FORM, CONTENT, ORIGINAL]

    NumberRole:
      type: string
      description: What a number tells of a work - SIZE how long it is, REACH how many saw it, APPROVAL how many liked it or how well they rate it
      enum: [SIZE, REACH, APPROVAL]

    TextRole:
      type: string
      description: What a text is - DESCRIPTION what the work is about, shown first; NOTES what the author adds, shown folded
      enum: [DESCRIPTION, NOTES]

    SignalInfo:
      type: object
      required: [key, labelKey, values]
      properties:
        key:
          type: string
        labelKey:
          type: string
        values:
          type: object
          description: The keys of the names of the values, by the value; a value not named is shown as it is
          additionalProperties:
            type: string

    SourceMode:
      type: string
      description: |
        SCRAPE_ALL - the whole catalogue, a job; UPDATES - what is new, a job; BROWSER - the pages the
        user opens, sent by the extension; PAGE - one work's page downloaded on the user's request
      enum: [SCRAPE_ALL, UPDATES, BROWSER, PAGE]

    FacetInfo:
      type: object
      required: [id, key, labelKey, filter, onCard, suggest, infer, editable]
      properties:
        id:
          type: string
          description: The facet as the filters and the model of the content type know it - its shared key, or "<source>.<key>"
        key:
          type: string
          description: The facet's key within its source
        labelKey:
          type: string
          description: The key of its label - "standard:facet.status", "ficbook:facet.direction"
        filter:
          type: boolean
        onCard:
          type: boolean
        suggest:
          type: boolean
          description: The application suggests values of it to confirm or reject
        infer:
          type: boolean
          description: |
            The application works the values out and gives them to the work as its own; the site's
            line of them (ItemFacet.original) is only what it learns from
        editable:
          type: boolean
          description: |
            Of the application's layer over the source - the standard tags, the kind, the universe,
            the characters, the pairings: the user corrects it. A facet of the site is shown and read
            as the site gives it, never corrected
        originalFacet:
          type: string
          description: |
            Of a facet of the layer: the key of the facet of the site that is the site's own word on
            it (its tags of the work's tags, its fandoms of the universes, its line of pairings and
            characters of the characters), shown right above it to answer by
        original:
          type: string
          description: The key of the text holding the facet's values as the site writes them
        role:
          $ref: '#/components/schemas/FacetRole'

    NumberInfo:
      type: object
      required: [id, key, labelKey]
      properties:
        id:
          type: string
          description: The number as the sorting and the model know it - its shared key, or "<source>.<key>"
        key:
          type: string
        labelKey:
          type: string
          description: The key of its label - "standard:number.likes", "ao3:number.bookmarks"
        scale:
          type: string
          description: LOG - a count spread over orders of magnitude (views, likes); LINEAR - a number of a fixed range (a rating)
          enum: [LOG, LINEAR]
        role:
          $ref: '#/components/schemas/NumberRole'

    TextInfo:
      type: object
      required: [key, labelKey, spoiler]
      properties:
        key:
          type: string
        labelKey:
          type: string
        spoiler:
          type: boolean
        role:
          $ref: '#/components/schemas/TextRole'

    ItemView:
      type: string
      description: UNRATED - works whose current version has no grade; RATED - graded; ALL - everything
      enum: [UNRATED, RATED, ALL]
      default: UNRATED

    ItemSort:
      type: string
      description: |
        SCORE - by prediction times the chance of interest (ItemSummary.interestChance; the prediction
        alone without a model of interest), then by prediction; UPDATED - newest update first; ADDED - the
        newest in the application first (first seen); NUMBER - by a number, the largest
        first; SURPRISE - the graded works the model that had not seen them (ItemSummary.heldOut)
        puts furthest from where the user's grade stands, first - below the lowest grade's place a
        work of it is no surprise, nor above the highest's; works without one last
      enum: [SCORE, UPDATED, ADDED, NUMBER, SURPRISE]
      default: SCORE

    FacetValueInfo:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
        name:
          type: string
          description: The value's name as the data has it - the site's, the catalogue's, the user's
        nameKey:
          type: string
          description: |
            Of a value of the application's own - a standard value ("standard:facet.status.value.finished"),
            an original character - the key of its name, shown instead of name
        corrected:
          type: string
          enum: [ADDED, CONFIRMED, REMOVED]
          description: |
            The user's word on the value: ADDED - the user gave it; CONFIRMED - the user said the
            work has it (the site or the model gave it); REMOVED - the user said the work has it
            not (shown crossed out)
        chance:
          type: number
          format: double
          nullable: true
          description: The model's chance that the work has the value, 0..1, whenever the model has one (null otherwise); the interface shows it by a value the user has not answered on
        inferred:
          type: boolean
          description: The model gave the value, the site did not
        draftedFrom:
          type: string
          description: |
            Given by the application, the user not having answered on it: the site's value it was drafted
            from through the dictionary - a fandom or a pairing of Archive of Our Own matched to a character
            or a universe by its tag there (Source.draft). Shown instead of the chance
        offered:
          type: boolean
          description: |
            Not the work's: one of the likeliest other values of a facet of the layer, offered for the
            user to answer on so that a work is offered at least three the site does not give
        implied:
          type: boolean
          description: The work's only as a tag above a tag of it (TagInfo.parents); not answered on by itself

    ItemFacet:
      type: object
      required: [facet, labelKey, values, editable]
      properties:
        facet:
          type: string
          description: The facet's key within its source
        labelKey:
          type: string
        editable:
          type: boolean
          description: Of the application's layer, corrected by the user (FacetInfo.editable); the site's otherwise
        values:
          type: array
          items:
            $ref: '#/components/schemas/FacetValueInfo'
        original:
          type: string
          description: The facet's values as the site writes them, shown above the worked out ones
        complete:
          type: boolean
          nullable: true
          description: The user said the work's values of it are all named - no other is offered, every other counts as rejected; none when not said

    Prediction:
      type: object
      required: [score]
      properties:
        score:
          type: number
          format: double
          description: |
            The work's place on the user's own scale: the centre of the lowest grade is 0, of the
            highest 10; works beyond the extreme grades go beyond 0..10

    HeldOut:
      type: object
      description: |
        How the model would grade a graded work not knowing the user's grade: the model of the fold
        the work was left out of in the cross-validation scores it and tells why. The model of every
        grade has seen the work and partly learnt it by heart; this one has not
      required: [score, explanation]
      properties:
        score:
          type: number
          format: double
          description: The work's place on the scale by that model
        gradePlace:
          type: number
          format: double
          description: Where the user's grade of the work stands on the scale
        explanation:
          type: array
          description: What moves that model's score, part by part, strongest first
          items:
            $ref: '#/components/schemas/ContributionGroup'

    ItemRef:
      type: object
      required: [source, item]
      properties:
        source:
          type: string
        item:
          type: string

    LinkedItem:
      type: object
      required: [source, item, title, url]
      properties:
        source:
          type: string
        item:
          type: string
        title:
          type: string
        url:
          type: string

    ItemSummary:
      type: object
      required: [source, item, title, version, url, updatedAt, facets, numbers, hasCover, pictureCount, linked, work]
      properties:
        work:
          type: string
          description: |
            The work the item is of, as "<source>/<item>" of the first of its items by key — the
            same for every item of the work; the item's own key when it is linked to no other.
            Every item has its own card all the same
        source:
          type: string
        item:
          type: string
        title:
          type: string
        version:
          type: string
        url:
          type: string
        updatedAt:
          type: string
          format: date-time
        facets:
          type: array
          description: The facets shown on a card
          items:
            $ref: '#/components/schemas/ItemFacet'
        numbers:
          type: object
          description: By the number's key within the item's source (SourceInfo.numbers[].key), corrections applied
          additionalProperties:
            type: number
            format: double
        hasCover:
          type: boolean
        pictureCount:
          type: integer
        grade:
          description: |
            The grade of this item's current version. Items the user linked as one work have one grade,
            written to each of them: given to one, it is given to the others; a link taken back leaves each its own
          allOf:
            - $ref: '#/components/schemas/Grade'
        previousGrade:
          $ref: '#/components/schemas/Grade'
        previousGradeVersion:
          type: string
        prediction:
          $ref: '#/components/schemas/Prediction'
        heldOut:
          $ref: '#/components/schemas/Prediction'
          description: |
            Of a graded work: the prediction of a model that had not seen it (the cross-validation's,
            from the fold it was left out of) - how the model would grade it not knowing the user's grade
        interest:
          type: boolean
          description: |
            The user's mark: interesting to read or not; none when not marked. Without a mark, a grade of 4
            or 5 (of the current version, else of the latest earlier one) says the work was interesting, a
            grade of 1 that it was not
        interestChance:
          type: number
          format: double
          description: |
            The chance, 0..1, the model of interest gives the user finds the work interesting; none without
            the model. The list sorted by the prediction puts the works by the prediction times the chance —
            1 or 0 for what the user said (the mark, or a grade of 4 or 5, or of 1)
        searchMatch:
          $ref: '#/components/schemas/SearchMatch'
        searchRelevant:
          type: boolean
          description: The user's word on the work for the line searched (judgeSearch); none when not judged or not searched
        signals:
          type: object
          description: The user's own actions on the site (liked, on a shelf)
          additionalProperties:
            type: string
        linked:
          type: array
          description: The other items that are this same work
          items:
            $ref: '#/components/schemas/LinkedItem'

    SearchMatch:
      type: object
      required: [byMeaning, text, highlights]
      description: |
        Where it was found: a field by the key of its label (labelKey), or a chapter - by its title as
        the data has it (title), or by its number when it has none (part, 1-based)
      properties:
        labelKey:
          type: string
        title:
          type: string
        part:
          type: integer
        byMeaning:
          type: boolean
          description: Found by meaning alone; the text is then the phrase of the field nearest by meaning
        text:
          type: string
        highlights:
          type: array
          items:
            $ref: '#/components/schemas/TextRange'

    TextRange:
      type: object
      required: [start, end]
      properties:
        start:
          type: integer
        end:
          type: integer

    ItemPage:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemSummary'

    SearchJudgment:
      type: object
      required: [query, source, item]
      properties:
        query:
          type: string
        source:
          type: string
        item:
          type: string
        relevant:
          type: boolean
          description: Whether the work answers the line; left out, the word is taken back

    SearchQuality:
      type: object
      required: [top, queries, reranked, plain]
      properties:
        top:
          type: integer
        queries:
          type: array
          items:
            $ref: '#/components/schemas/QueryQuality'
        reranked:
          $ref: '#/components/schemas/SearchQualitySum'
        plain:
          $ref: '#/components/schemas/SearchQualitySum'

    QueryQuality:
      type: object
      required: [query, relevant, irrelevant, reranked, plain]
      properties:
        query:
          type: string
        relevant:
          type: integer
          description: The works judged to answer the line
        irrelevant:
          type: integer
          description: The works judged not to
        reranked:
          $ref: '#/components/schemas/QueryRanks'
        plain:
          $ref: '#/components/schemas/QueryRanks'

    QueryRanks:
      type: object
      description: Where the works judged stand in what a search found
      required: [relevantInTop, irrelevantInTop, unjudgedInTop, relevantFound]
      properties:
        firstRelevant:
          type: integer
          description: The place of the first work judged fitting, from 1; none when none is found
        relevantInTop:
          type: integer
        irrelevantInTop:
          type: integer
        unjudgedInTop:
          type: integer
        relevantFound:
          type: integer
          description: The works judged fitting found at all

    SearchQualitySum:
      type: object
      required: [meanReciprocalRank, relevantInTop, irrelevantInTop, unjudgedInTop, relevantFound, relevant]
      properties:
        meanReciprocalRank:
          type: number
          format: double
          description: The mean over the lines of 1 / the place of the first work judged fitting, 0 when none is found
        relevantInTop:
          type: integer
        irrelevantInTop:
          type: integer
        unjudgedInTop:
          type: integer
        relevantFound:
          type: integer
        relevant:
          type: integer

    ItemQuery:
      type: object
      description: Which works a page of the list is of, and in what order
      properties:
        view:
          $ref: '#/components/schemas/ItemView'
        sort:
          $ref: '#/components/schemas/ItemSort'
        sortNumber:
          type: string
          description: The number to sort by when sort is NUMBER (ContentTypeInfo.numbers)
        search:
          type: string
          description: A line searched by meaning and by words; the order is then the relevance
        facets:
          type: array
          description: The filter facets that hide anything; a facet not here shows every work
          items:
            $ref: '#/components/schemas/FacetChoice'
        sources:
          type: array
          description: Only the works of these sources; all when none
          items:
            type: string
        ranges:
          type: array
          description: |
            Only the works whose number lies within a range, as "<number id>=<from>..<to>"
            (ContentTypeInfo.filterNumbers), both ends included; an end left out is open - "ficbook.parts=1..1",
            "ficbook.parts=10..". A work of a source that has the number and no value of it is not
            shown; the works of a source without the number are not limited by it.
          items:
            type: string
        offset:
          type: integer
          default: 0
        limit:
          type: integer
          default: 60

    FacetChoice:
      type: object
      description: |
        What a filter facet shows: a work shows when it has a value shown - or none of the facet's,
        and those are not hidden. Of the values, the shorter list is given: those hidden (every other
        shows, a value a site adds later too) or, when fewer, those shown alone (every other hidden,
        a value added later too).
      required: [facet]
      properties:
        facet:
          type: string
          description: The filter facet (FacetFilter.id)
        hidden:
          type: array
          description: The values not shown, by key
          items:
            type: string
        shown:
          type: array
          description: When given, the values shown alone, by key; hidden is then not read
          items:
            type: string
        withoutHidden:
          type: boolean
          description: The works without any value of the facet are not shown

    FacetFilter:
      type: object
      required: [id, labelKey, itemsWithout, values]
      properties:
        id:
          type: string
        labelKey:
          type: string
        noneLabelKey:
          type: string
          description: The key of the name of the works without a value of the facet; none - they are not a line of the filter
        itemsWithout:
          type: integer
        values:
          type: array
          items:
            $ref: '#/components/schemas/FacetValueUse'

    FacetValueUse:
      type: object
      required: [key, name, items]
      properties:
        key:
          type: string
        name:
          type: string
        nameKey:
          type: string
          description: Of a value of the application's own, the key of its name, shown instead of name (FacetValueInfo.nameKey)
        items:
          type: integer

    TextValue:
      type: object
      required: [key, labelKey, content, spoiler, corrected]
      properties:
        key:
          type: string
        labelKey:
          type: string
        content:
          type: string
        spoiler:
          type: boolean
        corrected:
          type: boolean

    NumberValue:
      type: object
      required: [key, labelKey, value, corrected]
      properties:
        key:
          type: string
        labelKey:
          type: string
        value:
          type: number
          format: double
        corrected:
          type: boolean

    PartInfo:
      type: object
      required: [partId, position, hasText]
      properties:
        partId:
          type: string
        position:
          type: integer
        title:
          type: string
        hasText:
          type: boolean
        publishedAt:
          type: string
          format: date-time
        influence:
          type: number
          format: double
          nullable: true
          description: Points of the user's scale the part's text moves the work by - the prediction as it is minus without this part; none when its text is not kept or the model reads no text of parts

    PartText:
      type: object
      required: [partId, position, content]
      properties:
        partId:
          type: string
        position:
          type: integer
        title:
          type: string
        content:
          type: string

    ItemDetails:
      type: object
      required: [summary, allFacets, texts, allNumbers, explanation, ratings, pictures, reviews, parts, pictureMatches, reviewMatches, titleCorrected, canRefresh, related]
      properties:
        summary:
          $ref: '#/components/schemas/ItemSummary'
        titleCorrected:
          type: boolean
        allFacets:
          type: array
          description: Every facet of the item, corrections included
          items:
            $ref: '#/components/schemas/ItemFacet'
        texts:
          type: array
          items:
            $ref: '#/components/schemas/TextValue'
        allNumbers:
          type: array
          items:
            $ref: '#/components/schemas/NumberValue'
        explanation:
          type: array
          description: What moves the prediction, part by part - a facet, the pictures, a text - strongest first, each with every feature in it
          items:
            $ref: '#/components/schemas/ContributionGroup'
        ratings:
          type: array
          description: The grades of every item of the work, newest first
          items:
            $ref: '#/components/schemas/RatingRecord'
        reviews:
          type: array
          description: The reviews that move the work most either way, strongest first; or the newest
          items:
            $ref: '#/components/schemas/ReviewInfo'
        reviewCount:
          type: integer
        pictures:
          type: array
          items:
            $ref: '#/components/schemas/PictureInfo'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/PartInfo'
        pictureMatches:
          type: array
          items:
            $ref: '#/components/schemas/PictureMatch'
        reviewMatches:
          type: array
          items:
            $ref: '#/components/schemas/ReviewMatch'
        canRefresh:
          type: boolean
          description: The source can download the item's page again
        related:
          type: array
          description: The other works of its series, then of the people who made it (but those of the series), with the user's grades
          items:
            $ref: '#/components/schemas/RelatedWorks'

    RelatedWorks:
      type: object
      required: [facet, labelKey, role, value, name, items]
      properties:
        facet:
          type: string
          description: The facet's key within the source
        labelKey:
          type: string
        role:
          $ref: '#/components/schemas/FacetRole'
        value:
          type: string
        name:
          type: string
          description: The series or the author
        items:
          type: array
          description: Its other works in the same source, by title
          items:
            $ref: '#/components/schemas/ItemSummary'

    MatchFeedbackRequest:
      type: object
      required: [kind, markSource, markItem, markRef, matchSource, matchItem, matchRef, verdict]
      properties:
        kind:
          type: string
          enum: [PICTURE, REVIEW]
        markSource:
          type: string
        markItem:
          type: string
        markRef:
          type: string
          description: The marked picture's position or the marked review's id
        matchSource:
          type: string
        matchItem:
          type: string
        matchRef:
          type: string
        verdict:
          type: integer
          minimum: -1
          maximum: 1
          description: +1 alike in the sense meant, -1 alike in another sense, 0 takes the word back

    PictureMatch:
      type: object
      required: [position, markSource, markItem, markTitle, markPosition, mark, strength]
      properties:
        position:
          type: integer
        markSource:
          type: string
        markItem:
          type: string
        markTitle:
          type: string
        markPosition:
          type: integer
        verdict:
          type: integer
        mark:
          type: integer
        strength:
          type: number
          format: double
          description: |
            How surprising the likeness is: -ln of the chance that as many random pictures of the
            catalogue would come as close; chance gives about 1, 3 one work in twenty, 5 one in 150

    ReviewMatch:
      type: object
      required: [reviewId, content, markSource, markItem, markReviewId, markTitle, markContent, mark, strength]
      properties:
        reviewId:
          type: string
        content:
          type: string
        markSource:
          type: string
        markItem:
          type: string
        markReviewId:
          type: string
        markTitle:
          type: string
        markContent:
          type: string
        verdict:
          type: integer
        mark:
          type: integer
        strength:
          type: number
          format: double

    ReviewInfo:
      type: object
      required: [reviewId, content]
      properties:
        reviewId:
          type: string
        author:
          type: string
        stars:
          type: number
          format: double
        content:
          type: string
        postedAt:
          type: string
          format: date-time
        influence:
          type: number
          format: double
          description: Points of the 0..10 scale the review moves the work, left out of the reviews' set and of their likeness to the marked ones
        mark:
          type: integer

    Mark:
      type: object
      required: [mark]
      properties:
        mark:
          type: integer
          minimum: -1
          maximum: 1
          description: +1 a reason to pick the work, -1 a reason to drop it

    PictureInfo:
      type: object
      required: [position, hasFull, analyzed]
      properties:
        position:
          type: integer
          description: 0 the cover, 1.. the screenshots
        hasFull:
          type: boolean
        analyzed:
          type: boolean
        mark:
          type: integer
        influence:
          type: number
          format: double
        error:
          type: string

    RatingRecord:
      type: object
      required: [source, item, version, grade, ratedAt, current]
      properties:
        source:
          type: string
        item:
          type: string
          description: The item of the work graded - this one or one linked to it
        current:
          type: boolean
          description: The grade is of the item's current version
        version:
          type: string
        grade:
          $ref: '#/components/schemas/Grade'
        ratedAt:
          type: string
          format: date-time

    ContributionGroup:
      type: object
      required: [part, labelKey, contribution, features]
      properties:
        part:
          type: string
          description: The part of the input switched off as a whole - "facet:<id>", a block, "part:pictures"
        labelKey:
          type: string
        contribution:
          type: number
          format: double
          description: Points of the 0..10 scale the part moves the work, as a whole
        features:
          type: array
          description: Every feature of the part, strongest first
          items:
            $ref: '#/components/schemas/FeatureContribution'

    FeatureContribution:
      type: object
      required: [feature, labelKey, contribution, present]
      description: |
        A feature: the key of the label of what it is of (a facet, a number, a block of the model's
        input, "standard:model.previous", "standard:model.source"), and of a feature of one value
        that value - as the data names it (value), or the key of its name (valueKey: a standard value,
        a source's title)
      properties:
        feature:
          type: string
        labelKey:
          type: string
        value:
          type: string
        valueKey:
          type: string
        contribution:
          type: number
          format: double
          description: Points of the 0..10 scale the feature moves the work
        present:
          type: boolean

    RatingRequest:
      type: object
      required: [grade]
      properties:
        grade:
          $ref: '#/components/schemas/Grade'

    InterestRequest:
      type: object
      required: [interesting]
      properties:
        interesting:
          type: boolean

    FacetCorrection:
      type: object
      required: [facet, added]
      properties:
        facet:
          type: string
          description: The facet's key within the item's source
        key:
          type: string
          description: |
            The value's key; when none, the value is found by its name among the facet's values
            (any case), and a new one gets the name in lower case as its key
        name:
          type: string
          description: The name of a value the user makes up; required without a key
        added:
          type: boolean
          description: true - the value is added; false - the site's value is taken away

    FacetAnswer:
      type: object
      required: [facet, key]
      description: An answer on a value as kept - the page shows it by this, nothing of the work read back
      properties:
        facet:
          type: string
        key:
          type: string
          description: The value's key - of a value named alone, the one found or made for it
        name:
          type: string
          description: The name the answer was given with, when it named the value

    FieldCorrection:
      type: object
      required: [content]
      properties:
        content:
          type: string

    JobRequest:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/SourceMode'

    JobState:
      type: string
      enum: [IDLE, RUNNING, CANCELLING, DONE, CANCELLED, FAILED]

    JobStatus:
      type: object
      required: [source, state, processed, total, newItems, errors, items]
      properties:
        source:
          type: string
        state:
          $ref: '#/components/schemas/JobState'
        mode:
          $ref: '#/components/schemas/SourceMode'
        resumable:
          $ref: '#/components/schemas/SourceMode'
        phase:
          type: string
        phaseStartedAt:
          type: string
          format: date-time
        processed:
          type: integer
        total:
          type: integer
        newItems:
          type: integer
        errors:
          type: integer
        messageKey:
          type: string
          description: What the user should know at the end, by the key of its words - "f95zone:job.noCookie"
        failure:
          type: string
          description: Why the job failed, as the code tells it - not words of the interface
        loggedIn:
          type: boolean
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        items:
          type: integer
          description: Items of the source in the database
        catalogue:
          $ref: '#/components/schemas/CatalogueProgress'

    CatalogueProgress:
      type: object
      required: [stage, done, total, complete]
      description: How far the whole catalogue is loaded, across runs of the job
      properties:
        stage:
          type: string
          description: What the scrape does now or would do next ("feed", "details"); "none" - never started
        done:
          type: integer
        total:
          type: integer
        complete:
          type: boolean
          description: The catalogue is loaded; only updates are left

    ScorerInfo:
      type: object
      description: A scorer; its id is the namespace of its words, its title "<id>:title"
      required: [id]
      properties:
        id:
          type: string

    ScorerChoice:
      type: object
      required: [scorer]
      properties:
        scorer:
          type: string

    ModelMetrics:
      type: object
      required: [folds, concordance, concordanceSe]
      description: Out-of-fold quality from cross-validation over works
      properties:
        folds:
          type: integer
        concordance:
          type: number
          format: double
          description: Share of pairs of works of different grades put in the right order
        concordanceSe:
          type: number
          format: double
        spearman:
          type: number
          format: double
        auc:
          type: number
          format: double
          description: ROC AUC of liked (above "can be played") against disliked

    ModelCandidate:
      type: object
      required: [parameter, metrics]
      properties:
        parameter:
          type: number
          format: double
        metrics:
          $ref: '#/components/schemas/ModelMetrics'

    ModelWorth:
      type: object
      required: [scorer, grades, parts]
      properties:
        scorer:
          type: string
        grades:
          type: integer
          description: The grades the ranking is cross-validated on
        full:
          $ref: '#/components/schemas/ModelMetrics'
        parts:
          type: array
          description: Every part of the input, the one whose removal costs most first
          items:
            $ref: '#/components/schemas/PartWorth'

    Weighing:
      type: object
      required: [scorer, grades, groups, folds, baseline, baselineSe, weighed, weighedSe, gain, gainSe]
      properties:
        scorer:
          type: string
        grades:
          type: integer
        groups:
          type: array
          description: The parts weighed by themselves, and every small part together
          items:
            $ref: '#/components/schemas/WeighedGroup'
        folds:
          type: array
          items:
            $ref: '#/components/schemas/WeighingFold'
        baseline:
          type: number
          format: double
          description: The concordance of every weight 1 on the folds, as the weighed one is measured
        baselineSe:
          type: number
          format: double
        weighed:
          type: number
          format: double
          description: The concordance of the weights chosen without the fold
        weighedSe:
          type: number
          format: double
        gain:
          type: number
          format: double
          description: The mean of the folds' differences, weighed against every weight 1
        gainSe:
          type: number
          format: double
        onAll:
          $ref: '#/components/schemas/ModelMetrics'

    WeighedGroup:
      type: object
      required: [part, labelKey, columns, weight]
      properties:
        part:
          type: string
        labelKey:
          type: string
        columns:
          type: integer
        weight:
          type: number
          format: double
          description: The weight chosen on every grade

    WeighingFold:
      type: object
      required: [baseline, weighed, weights]
      properties:
        baseline:
          type: number
          format: double
        weighed:
          type: number
          format: double
        weights:
          type: array
          description: The weights chosen without the fold, in the order of the groups
          items:
            type: number
            format: double

    PartWorth:
      type: object
      required: [part, labelKey, features]
      properties:
        part:
          type: string
          description: The part as the explanation names it - "facet:<id>", a block, "part:pictures"
        labelKey:
          type: string
        features:
          type: integer
          description: Its columns in the model's input
        metrics:
          $ref: '#/components/schemas/ModelMetrics'

    ScorerComparison:
      type: object
      required: [startedAt, grades, scorers]
      properties:
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          description: Absent while scorers are still being measured
        grades:
          type: integer
          description: How many grades the scorers are measured on; 0 when there are too few to cross-validate
        scorers:
          type: array
          items:
            $ref: '#/components/schemas/ScorerQuality'

    ScorerQuality:
      type: object
      required: [scorer, state, candidates]
      properties:
        scorer:
          type: string
          description: The scorer's id; its title "<scorer>:title"
        state:
          type: string
          enum: [WAITING, MEASURING, DONE, FAILED]
        error:
          type: string
        millis:
          type: integer
          format: int64
          description: How long its measuring took, once done
        chosen:
          $ref: '#/components/schemas/ModelCandidate'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ModelCandidate'

    GradeOnScale:
      type: object
      required: [grade, score, ratings]
      properties:
        grade:
          $ref: '#/components/schemas/Grade'
        score:
          type: number
          format: double
        ratings:
          type: integer

    ModelInfo:
      type: object
      required: [trained, training, stale, textEncoderReady, imageEncoderReady, ladder, ratingCounts, features, candidates, topPositive, topNegative, scorers, scorer]
      properties:
        trained:
          type: boolean
        training:
          type: boolean
        stale:
          type: boolean
        textEncoderReady:
          type: boolean
        imageEncoderReady:
          type: boolean
        scorer:
          type: string
          description: The scorer the type is ranked by
        scorers:
          type: array
          items:
            $ref: '#/components/schemas/ScorerInfo'
        trainedAt:
          type: string
          format: date-time
        parameter:
          type: number
          format: double
        ladder:
          type: array
          items:
            $ref: '#/components/schemas/GradeOnScale'
        ratingCounts:
          type: array
          items:
            type: integer
        features:
          type: integer
        metrics:
          $ref: '#/components/schemas/ModelMetrics'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ModelCandidate'
        topPositive:
          type: array
          items:
            $ref: '#/components/schemas/FeatureContribution'
        topNegative:
          type: array
          items:
            $ref: '#/components/schemas/FeatureContribution'

    SettingValue:
      type: object
      required: [key, labelKey, kind, secret, set]
      properties:
        key:
          type: string
        labelKey:
          type: string
        kind:
          type: string
          enum: [TEXT, NUMBER]
        secret:
          type: boolean
        set:
          type: boolean
        value:
          type: string
          description: The value; never given for a secret
        hintKey:
          type: string

    SourceSettings:
      type: object
      required: [source, values]
      properties:
        source:
          type: string
          description: The source's id; its title "<source>:title"
        values:
          type: array
          items:
            $ref: '#/components/schemas/SettingValue'

    CapturePatterns:
      type: object
      required: [source, patterns]
      properties:
        source:
          type: string
        patterns:
          type: array
          description: Regular expressions over the whole address
          items:
            type: string

    ExtensionInfo:
      type: object
      properties:
        manifest:
          type: string
          description: The absolute path of the extension's manifest.json on the machine the application runs on; none when it is not there
        version:
          type: string

    CaptureRequest:
      type: object
      required: [url, html]
      properties:
        url:
          type: string
        html:
          type: string
          description: The DOM of the page as the user saw it

    CaptureResult:
      type: object
      required: [items]
      properties:
        source:
          type: string
          description: The source that took the page; none - no source wants it
        items:
          type: array
          items:
            $ref: '#/components/schemas/LinkedItem'
        parts:
          type: array
          description: The parts (chapters) whose text the page gave and the source saved
          items:
            $ref: '#/components/schemas/CapturedPart'

    CapturedPart:
      type: object
      required: [source, item, length]
      properties:
        source:
          type: string
        item:
          type: string
        itemTitle:
          type: string
        title:
          type: string
          description: The part's title; none when the page does not name it
        length:
          type: integer
          description: How many characters its text has

    CapturedPageInfo:
      type: object
      required: [source, url, capturedAt]
      properties:
        source:
          type: string
        url:
          type: string
        item:
          type: string
        title:
          type: string
        capturedAt:
          type: string
          format: date-time

    WorkStatus:
      type: object
      required: [name, done, total, running]
      properties:
        name:
          type: string
          description: pictures, texts, parts, sets
        done:
          type: integer
        total:
          type: integer
        failed:
          type: integer
        running:
          type: boolean
        perMinute:
          type: number
          format: double

    Status:
      type: object
      required: [work]
      properties:
        work:
          type: array
          items:
            $ref: '#/components/schemas/WorkStatus'

    SuggestedValue:
      type: object
      required: [key, name, chance]
      properties:
        key:
          type: string
        name:
          type: string
        nameKey:
          type: string
          description: Of a value of the application's own, the key of its name, shown instead of name (FacetValueInfo.nameKey)
        chance:
          type: number
          format: double
          description: The chance the work has the value, 0..1

    FacetSuggestions:
      type: object
      required: [facet, labelKey, suggested]
      description: |
        The values of a facet the work lacks and more likely has than not, the likeliest first - to
        confirm or reject. The chances of the values it has come with the values (FacetValueInfo).
        A facet the application works out (FacetInfo.infer) has none: such values are given to the
        work at once.
      properties:
        facet:
          type: string
          description: The facet's key within the item's source
        labelKey:
          type: string
        suggested:
          type: array
          items:
            $ref: '#/components/schemas/SuggestedValue'

    FacetDecorInfo:
      type: object
      required: [facet]
      description: The site's elements of the facet's values (values), or the element after which a line of the facet's values goes (after)
      properties:
        facet:
          type: string
        values:
          type: string
        after:
          type: string

    ReviewDecorInfo:
      type: object
      required: [selector, idAttribute, idPrefix]
      properties:
        selector:
          type: string
        idAttribute:
          type: string
        idPrefix:
          type: string

    CardDecorInfo:
      type: object
      required: [selector, link]
      properties:
        selector:
          type: string
        link:
          type: string

    PageDecorInfo:
      type: object
      required: [facets]
      description: CSS selectors of the site's own elements the extension marks up (the plugin API's PageDecor)
      properties:
        panelAfter:
          type: string
        facets:
          type: array
          items:
            $ref: '#/components/schemas/FacetDecorInfo'
        reviews:
          $ref: '#/components/schemas/ReviewDecorInfo'
        pictures:
          type: string
          description: The selector of the work's images on its page
        cards:
          $ref: '#/components/schemas/CardDecorInfo'

    PagePicture:
      type: object
      required: [position, url]
      properties:
        position:
          type: integer
        url:
          type: string
        mark:
          type: integer

    PageItem:
      type: object
      description: |
        The work as a page shows it. What moves its prediction is read apart (getExplanation): of a
        graded work it is the held-out model's, fitted for the asking
      required: [summary, facets, suggestions, pictures, reviewMarks, ratings]
      properties:
        summary:
          $ref: '#/components/schemas/ItemSummary'
        facets:
          type: array
          description: |
            The facets the page marks up or the application suggests or works out values of, corrections
            included — every one, with its label, those the work has no values of too

          items:
            $ref: '#/components/schemas/ItemFacet'
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/FacetSuggestions'
        pictures:
          type: array
          items:
            $ref: '#/components/schemas/PagePicture'
        reviewMarks:
          type: object
          description: The user's marks of the work's reviews, by review id
          additionalProperties:
            type: integer
        ratings:
          type: array
          items:
            $ref: '#/components/schemas/RatingRecord'

    PageView:
      type: object
      required: [source, type, decor]
      properties:
        source:
          type: string
          description: The source's id; its title "<source>:title"
        type:
          type: string
          description: The content type of the source's works
        decor:
          $ref: '#/components/schemas/PageDecorInfo'
        itemId:
          type: string
          description: The work the page is of, when it is a work's page - known to the application or not yet
        item:
          $ref: '#/components/schemas/PageItem'

    CardsRequest:
      type: object
      required: [url, links]
      properties:
        url:
          type: string
          description: The address of the page the cards are on
        links:
          type: array
          items:
            type: string

    CardView:
      type: object
      required: [link, source, item, title]
      properties:
        link:
          type: string
          description: The link as it was sent
        source:
          type: string
        item:
          type: string
        title:
          type: string
        grade:
          $ref: '#/components/schemas/Grade'
        previousGrade:
          $ref: '#/components/schemas/Grade'
        prediction:
          type: number
          format: double
        interest:
          type: boolean
          description: The user's mark of interest (ItemSummary.interest)
        interestChance:
          type: number
          format: double
          description: The chance of interest by the model (ItemSummary.interestChance)

    Candidate:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
        name:
          type: string
        nameKey:
          type: string
          description: Of a value of the application's own, the key of its name, shown instead of name (FacetValueInfo.nameKey)
        chance:
          type: number
          format: double
          nullable: true
          description: The model's chance that the work has the value, 0..1; none before the model has learnt anything
        mentions:
          type: integer
          nullable: true
          description: How many times the work's texts name it (in how many paragraphs, of a pairing); none when not counted
        url:
          type: string
          nullable: true
          description: Its page in the catalogue of universes (Wikidata), as the dictionary keeps it; none for a value of no catalogue

    MentionQuote:
      type: object
      required: [text, highlights]
      description: |
        Where in the work the passage is: a text or a facet of it by the key of its label (labelKey),
        or a chapter - by its title as the data has it (title), by its number when it has none (part, 1-based)
      properties:
        labelKey:
          type: string
        title:
          type: string
        part:
          type: integer
        text:
          type: string
          description: A paragraph, or the part of a long one around the names, cut with "…"
        highlights:
          type: array
          description: The names of the value in the text, end exclusive
          items:
            $ref: '#/components/schemas/TextRange'

    UniverseRef:
      type: object
      required: [catalogue, universe]
      properties:
        catalogue:
          type: string
          description: The catalogue the universe is of ("wikidata")
        universe:
          type: string
          description: The universe's id within the catalogue ("Q8337")

    UniverseInfo:
      type: object
      required: [catalogue, universe, value, name, catalogueName, url, characters, total, works, addedAt, refreshedAt]
      properties:
        catalogue:
          type: string
        universe:
          type: string
        value:
          type: string
          description: The key of the universe as a value of the facet "universe" of the works
        name:
          type: string
          description: What it is shown by - the user's name, else the catalogue's
        catalogueName:
          type: string
          description: The catalogue's name, in the user's languages
        localName:
          type: string
          description: The name the user gave it over the catalogue's, when given
        description:
          type: string
        url:
          type: string
          description: The universe's page in the catalogue
        characters:
          type: integer
          description: Its entries kept as characters
        total:
          type: integer
          description: Every entry the catalogue said is in it - characters, places, groups, things
        works:
          type: integer
          description: The works the user linked to it
        addedAt:
          type: string
          format: date-time
        refreshedAt:
          type: string
          format: date-time
          description: When its characters were last asked of the catalogue

    FoundUniverse:
      type: object
      required: [catalogue, universe, name, url, added]
      properties:
        catalogue:
          type: string
        universe:
          type: string
        name:
          type: string
        description:
          type: string
        url:
          type: string
        added:
          type: boolean
          description: The dictionary has it already

    UniverseClassInfo:
      type: object
      required: [class, name, character, count, included]
      properties:
        class:
          type: string
          description: The class's id within the catalogue
        name:
          type: string
        character:
          type: boolean
          description: Its entries are characters, as the catalogue says
        count:
          type: integer
          description: The universe's entries of it
        included:
          type: boolean
          description: Its entries are kept as characters - by the user's word, else when they are characters
        choice:
          type: boolean
          nullable: true
          description: The user's word on it within the universe; none when the catalogue decides

    TagPage:
      type: object
      required: [total, tags, sources]
      properties:
        total:
          type: integer
        sources:
          type: array
          description: |
            What a tag may come from, to filter by (with, without): the sites of the type that have its free tags, then
            the catalogues tags are bound to entries of - whatever the filter
          items:
            type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagInfo'

    TagNameRule:
      type: string
      description: |
        What gave a tag its name: EXPLICIT - the user; CATALOGUE - the label of the entry of a catalogue it is bound to,
        in the user's first language that has one; LIKED - the name most used by the works graded above the middle of
        the scale; GRADED - by the works graded; ALL - by all its works; ALPHABET - the first by the alphabet
      enum: [EXPLICIT, CATALOGUE, LIKED, GRADED, ALL, ALPHABET]

    TagInfo:
      type: object
      required: [key, name, rule, works, graded, liked, variants, names, parents, children, catalogueEntries, descriptions, catalogueOffers]
      properties:
        key:
          type: string
          description: The normalized tag's id, written out - the value of the works' tags
        name:
          type: string
        rule:
          $ref: '#/components/schemas/TagNameRule'
        explicitName:
          type: string
          description: The name the user gave the tag, when given
        works:
          type: integer
        graded:
          type: integer
        liked:
          type: integer
          description: Works graded above the middle of the scale
        variants:
          type: array
          description: The sites' tags bound to this one, with their works, the most used first
          items:
            $ref: '#/components/schemas/TagVariantInfo'
        names:
          type: array
          description: |
            The names of its sites' tags, each once as written, in the order the name is chosen by: the most
            used by the liked works first, of those used equally by the graded works, then by all, then by
            the alphabet. Without a name the user gave, the first is the tag's name
          items:
            type: string
        parents:
          type: array
          description: The tags right above this one - a work with this tag has them too
          items:
            $ref: '#/components/schemas/TagRef'
        children:
          type: array
          description: The tags right under this one - a work said not to have this tag has none of them
          items:
            $ref: '#/components/schemas/TagRef'
        catalogueEntries:
          type: array
          description: The entries of the catalogues the tag is bound to, the one bound first first - its label names the tag
          items:
            $ref: '#/components/schemas/TagEntryInfo'
        descriptions:
          type: array
          description: >
            What the tag means, as its sites' tags' own pages say - in the order of its sites' tags - and then as its
            entries do; of the one tag asked alone, none in a list
          items:
            $ref: '#/components/schemas/TagDescription'
        catalogueOffers:
          type: array
          description: >
            Other tags offered above or under this one by what their entries are a kind of in a catalogue - not the
            ones above or under it already; of the one tag asked alone, none in a list
          items:
            $ref: '#/components/schemas/CatalogueOffer'

    CatalogueOffer:
      type: object
      required: [catalogue, tag, relation, path]
      properties:
        catalogue:
          type: string
        tag:
          $ref: '#/components/schemas/TagRef'
        relation:
          $ref: '#/components/schemas/TagRelation'
        path:
          type: array
          description: The entries of the way up, from the lower tag's to the upper's, by their labels
          items:
            type: string

    HierarchyOfferKind:
      type: string
      description: >
        LINK - the first tag under the second; MERGE - the two tags one; NEW_PARENT - a new tag of the entry above the
        tags; BIND_PARENT - the tag of the entry's name (existing) bound to it and put above the tags; UNLINK - the first
        tag right under the second no more, under it through the third already - of the user's graph, no catalogue's
      enum: [LINK, MERGE, NEW_PARENT, BIND_PARENT, UNLINK]

    HierarchyOffer:
      type: object
      required: [kind, tags, path, graded, levels]
      properties:
        kind:
          $ref: '#/components/schemas/HierarchyOfferKind'
        catalogue:
          type: string
        tags:
          type: array
          description: LINK - the child, then the parent; UNLINK - the child, the parent, the tag between; MERGE - the two, the one of more works first, which the other is merged into; NEW_PARENT - the tags under the new one, the most graded first
          items:
            $ref: '#/components/schemas/TagRef'
        entry:
          type: string
          description: The entry the two tags are bound to (MERGE) or the new tag would be (NEW_PARENT)
        url:
          type: string
          description: The entry's page
        path:
          type: array
          description: The entries of the way up from the child's entry to the parent's (LINK), the entry alone else - by their labels
          items:
            type: string
        graded:
          type: integer
          description: >
            The graded works it changes - LINK - of the child without the parent, which get it, and the ones said to
            have not the parent, which have not the child either; MERGE - of the smaller of the two; NEW_PARENT - of any
            of the tags, which get the new one

        existing:
          $ref: '#/components/schemas/TagRef'
        levels:
          type: integer
          description: >
            How many levels up the catalogue the tags meet - LINK - from the child's entry to the parent's; MERGE - 0;
            NEW_PARENT - the farther of the two of its nearest pair. The nearest come first

    TagAboveRequest:
      type: object
      required: [catalogue, entry, children]
      properties:
        catalogue:
          type: string
        entry:
          type: string
        children:
          type: array
          items:
            type: string
        tag:
          type: string
          description: A tag there already, bound to the entry besides its own and put above - none, a new tag made

    TagDescription:
      type: object
      required: [origin, text]
      properties:
        origin:
          type: string
          description: Who says it - a source's id ("ficbook") or a catalogue's ("wikidata")
        name:
          type: string
          description: The name of what is described there - the site's tag as written, the entry's label
        text:
          type: string

    TagEntryInfo:
      type: object
      description: The entry of a catalogue a tag is bound to, as the catalogue gave it when last asked
      required: [catalogue, entry, url, names]
      properties:
        catalogue:
          type: string
          description: The catalogue's id ("wikidata"); its title "<catalogue>:title"
        entry:
          type: string
          description: The entry's id within the catalogue ("Q305561")
        url:
          type: string
        label:
          type: string
          description: Its label in the user's first language that has one
        description:
          type: string
          description: What it is, in the user's first language that has it - what tells it from its namesakes
        names:
          type: array
          description: Every name of it kept, of every language - the label and the aliases; the tag is found by any of them
          items:
            type: string

    FoundTagEntry:
      type: object
      required: [catalogue, entry, url, tags]
      properties:
        catalogue:
          type: string
        entry:
          type: string
        url:
          type: string
        label:
          type: string
        description:
          type: string
        tags:
          type: array
          description: The tags bound to it already
          items:
            $ref: '#/components/schemas/TagRef'

    TagEntryRequest:
      type: object
      required: [tag, catalogue, entry, bound]
      properties:
        tag:
          type: string
        catalogue:
          type: string
        entry:
          type: string
        bound:
          type: boolean
          description: True - the tag bound to the entry besides the ones it is; false - no more to it

    TagRef:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
        name:
          type: string

    TagRelation:
      type: string
      description: |
        What a tag is to another: NONE; MERGED - one tag (merged into it; of a site's tag, bound to it);
        CHILD - under it; PARENT - above it; DIFFERENT - a different tag; DESCENDANT - under it through other tags,
        ANCESTOR - above it through others: read only, never said of the two
      enum: [NONE, MERGED, CHILD, PARENT, DIFFERENT, DESCENDANT, ANCESTOR]

    TagRelationRequest:
      type: object
      required: [tag, other, relation]
      properties:
        tag:
          type: string
        other:
          type: string
        relation:
          $ref: '#/components/schemas/TagRelation'

    TagVariantInfo:
      type: object
      description: A site's tag
      required: [source, tag, name, works, graded, liked]
      properties:
        source:
          type: string
        tag:
          type: string
          description: The site's own key of the tag
        name:
          type: string
        works:
          type: integer
        graded:
          type: integer
        liked:
          type: integer

    SimilarTag:
      type: object
      required: [tag, similarity, relation]
      properties:
        tag:
          $ref: '#/components/schemas/TagInfo'
        similarity:
          type: number
          format: double
          description: The cosine of the meaning of their names, up to 1
        relation:
          $ref: '#/components/schemas/TagRelation'
        site:
          # Of a row of a site's tag bound to the tag asked of (MERGED), that site's tag; then tag is the tag itself
          $ref: '#/components/schemas/TagVariantInfo'

    TagNameRequest:
      type: object
      required: [tag]
      properties:
        tag:
          type: string
        name:
          type: string

    SimilarTagPage:
      type: object
      required: [total, tags]
      properties:
        total:
          type: integer
          description: How many rows the whole table has, the hidden left out
        tags:
          type: array
          items:
            $ref: '#/components/schemas/SimilarTag'

    TagBindingRequest:
      type: object
      required: [source, siteTag]
      properties:
        source:
          type: string
        siteTag:
          type: string
          description: The site's own key of the tag
        tag:
          type: string
          description: The key of the normalized tag to bind it to; none - a new one of its own

    LocalName:
      type: object
      properties:
        name:
          type: string
          description: The user's name; none or blank - the catalogue's again

    Inclusion:
      type: object
      required: [included]
      properties:
        included:
          type: boolean
          description: Kept as characters, or left out

    CharacterInfo:
      type: object
      required: [character, value, names, url, classes, included]
      properties:
        classes:
          type: array
          description: The ids of the classes it is of
          items:
            type: string
        included:
          type: boolean
          description: Kept as a character - by the user's word on it, else by its classes
        choice:
          type: boolean
          nullable: true
          description: The user's word on it alone; none when its classes decide
        character:
          type: string
          description: The character's id within the catalogue
        value:
          type: string
          description: The key of the character as a value of the facet "characters" of the works
        names:
          type: array
          description: Every name it goes by, the main one first - the user's name, when given
          items:
            type: string
        localName:
          type: string
          description: The name the user gave it over the catalogue's, when given
        description:
          type: string
        url:
          type: string
